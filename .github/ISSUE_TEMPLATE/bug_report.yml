name: Bug 反馈
description: 报告一个可复现的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把环境和复现步骤写清楚，能大幅加快修复。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 见 package.json 或 Release 页
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - docker compose
        - 本地 node server.js
        - 其他（请在补充说明中写明）
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本
      placeholder: v22.12.0
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      render: shell
