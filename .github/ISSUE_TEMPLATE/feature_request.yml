name: 功能建议
description: 提出一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
  - type: checkboxes
    id: pr
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现它
